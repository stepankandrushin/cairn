# The tests under cargo-nextest, which scripts/ci.sh runs them with, the full suite and the quick run alike:
# each test is a process of its own, and the tests of every file share one pool, where cargo test runs one
# file after another. A sweep too long for one test (each step of a sync to kill it at, the random seeds, a
# list of cases) is many, made by `shards!` (crates/harness/tests/common), each running its share on one
# thread. The harness keeps each test's servers on ports of their own (next_port, by
# NEXTEST_TEST_GLOBAL_SLOT), and its roots in a list of their own (cairn_harness::user_dir_of).
#
# A full run is as long as the disk takes over all of it: every fsync is a journal commit, and on an ext4 of
# two consumer NVMe drives in RAID1 a commit is two cache flushes of 3 to 6 ms each, which the tests take
# turns at, some 60,000 of them for the suite's 90 GB of writes. Its longest test, the join of 50,000
# files, places them 64 at a time with their fsyncs at once, and takes 2 minutes on such a disk by itself
# and 5 to 8 beside the rest.

[profile.default]
# Slow is not failing: each test's own deadlines say when something hangs. Every failure is reported,
# not only the first.
slow-timeout = { period = "60s" }
fail-fast = false
final-status-level = "fail"

# The longest first, as the run lasts until the last test ends: syncs of thousands of files, and a storm of
# renames during one, which no split of a test shortens.
[[profile.default.overrides]]
filter = "test(=a_join_of_50_000_files_leaves_the_other_devices_incremental)"
priority = 100

[[profile.default.overrides]]
filter = """
    test(=hard_links_across_commits_of_a_big_change_all_stay) |
    test(=a_rename_storm_during_sync_loses_nothing)
"""
priority = 90

[[profile.default.overrides]]
filter = """
    test(=a_change_too_big_for_one_commit_goes_in_several) |
    test(=the_periodic_check_holds_little_more_than_the_round) |
    test(=one_edit_in_a_big_tree_lists_a_few_folders_not_the_tree) |
    test(=a_move_of_the_servers_database_on_a_full_disk_leaves_schema_3_as_it_was) |
    test(=a_folder_of_thousands_renamed_looks_at_what_is_in_it_and_no_more) |
    test(=every_kind_of_change_reaches_the_other_device_through_scoped_syncs) |
    test(=every_kind_of_change_reaches_the_other_device_by_widening_alone) |
    test(=a_folder_of_thousands_of_subfolders_is_watched_whole_under_a_low_limit) |
    test(=a_kill_anywhere_in_the_move_to_schema_4_leaves_one_schema_or_the_other_whole) |
    test(=a_state_of_version_1_is_moved_by_the_next_sync_and_holds_the_same) |
    test(=a_kill_anywhere_in_the_move_leaves_one_layout_or_the_other_whole) |
    test(=an_edit_whose_event_was_lost_waits_for_the_check_or_the_reconcile) |
    test(=a_join_slower_than_a_busy_device_still_agrees) |
    test(=a_server_moves_a_database_of_schema_3_when_it_starts_and_answers_the_same) |
    test(=a_long_offline_device_does_not_bring_back_what_was_deleted)
"""
priority = 50

# A daemon's first sync of 2,000 files within its 30 s: when they were fsynced one after another, each file's
# took some 30 ms beside the full run's other tests, and it failed in every such run, so it runs last and
# alone, in some 8 s.
[[profile.default.overrides]]
filter = "test(=the_daemon_compacts_a_state_its_join_left_mostly_free)"
priority = -100
threads-required = "num-test-threads"

# `scripts/ci.sh --quick`, before a commit: everything but the tests that sweep every step of a sync, or
# a sync at every size, which take a minute or more each. The full suite is what a release passes first, in
# its own tree on the machine that builds it, and GitHub runs it on every push.
[profile.quick]
fail-fast = true
# Those over 20 s in a full run, a sweep's parts counted together. A test renamed or added runs here too, until
# it is listed: the list can only make this run longer, never leave out what it does not name.
default-filter = """not (
    test(=a_change_too_big_for_one_commit_goes_in_several) |
    test(=a_daemon_killed_while_receiving_does_not_undo_a_revert_elsewhere) |
    test(/^a_download_in_slices_killed_at_every_step_loses_nothing::/) |
    test(/^a_download_killed_before_its_rows_are_stored_is_not_this_devices_change::/) |
    test(=a_file_being_written_holds_back_nothing_else) |
    test(=a_folder_of_thousands_of_subfolders_is_watched_whole_under_a_low_limit) |
    test(=a_folder_of_thousands_renamed_looks_at_what_is_in_it_and_no_more) |
    test(/^a_full_disk_at_every_client_write_loses_nothing::/) |
    test(/^a_full_disk_at_every_step_of_a_download_loses_nothing::/) |
    test(/^a_full_disk_at_every_server_write_refuses_the_commit_and_loses_nothing::/) |
    test(=a_join_of_50_000_files_leaves_the_other_devices_incremental) |
    test(=a_join_s_notes_of_every_file_leave_the_other_devices_incremental) |
    test(=a_join_slower_than_a_busy_device_still_agrees) |
    test(=a_kept_edit_is_in_the_conflict_inbox_however_its_sync_ends) |
    test(=a_kill_anywhere_in_a_compaction_leaves_the_state_whole) |
    test(=a_kill_anywhere_in_the_move_leaves_one_layout_or_the_other_whole) |
    test(=a_kill_anywhere_in_the_move_to_schema_4_leaves_one_schema_or_the_other_whole) |
    test(/^a_kill_at_any_step_around_a_rule_loses_nothing::/) |
    test(/^a_kill_at_any_step_does_not_change_where_things_end_up::/) |
    test(=a_kill_at_any_step_leaves_a_whole_program_and_the_next_run_finishes) |
    test(/^a_kill_at_any_step_of_a_sync_with_nothing_to_do_changes_nothing::/) |
    test(/^a_kill_at_any_step_of_an_incremental_sync_loses_nothing::/) |
    test(=a_long_offline_device_does_not_bring_back_what_was_deleted) |
    test(=a_move_of_the_servers_database_on_a_full_disk_leaves_schema_3_as_it_was) |
    test(=a_private_folder_unreadable_when_it_next_changes_still_gets_its_mode) |
    test(=a_rename_storm_during_sync_loses_nothing) |
    test(=a_revert_elsewhere_stands_while_the_tree_keeps_moving) |
    test(=a_rewrite_in_place_meets_what_takes_a_name_beside_it) |
    test(=a_rule_taken_off_what_is_here_holds_what_the_join_decides_about) |
    test(/^a_server_killed_at_every_step_of_an_upload_request_keeps_only_whole_chunks::/) |
    test(=a_server_moves_a_database_of_schema_3_when_it_starts_and_answers_the_same) |
    test(=a_small_state_is_left_with_its_free_pages) |
    test(=a_state_of_version_1_is_moved_by_the_next_sync_and_holds_the_same) |
    test(=a_subscriber_that_never_reads_does_not_stall_syncs) |
    test(=a_sync_that_leaves_the_state_mostly_free_compacts_it_and_keeps_all_of_it) |
    test(=an_edit_kept_while_the_tree_keeps_moving_is_one_copy) |
    test(/^an_edit_while_a_files_metadata_is_set_is_sent::/) |
    test(=an_edit_whose_event_was_lost_waits_for_the_check_or_the_reconcile) |
    test(/^changes_that_meet_go_the_incremental_way::/) |
    test(/^every_kind_of_change_goes_the_incremental_way_and_reaches_the_other_device::/) |
    test(/^every_kind_of_change_is_seen_past_the_fast_path::/) |
    test(=every_kind_of_change_reaches_the_other_device_by_itself) |
    test(=every_kind_of_change_reaches_the_other_device_by_widening_alone) |
    test(=every_kind_of_change_reaches_the_other_device_through_scoped_syncs) |
    test(=files_a_join_s_note_names_that_also_changed_still_count) |
    test(=hard_links_across_commits_of_a_big_change_all_stay) |
    test(/^killed_at_every_client_step_nothing_is_lost::/) |
    test(/^killed_at_every_server_step_acknowledged_commits_stay::/) |
    test(=one_edit_in_a_big_tree_lists_a_few_folders_not_the_tree) |
    test(/^random_operations_on_three_devices_lose_nothing::/) |
    test(/^random_operations_with_rules_coming_and_going_on_one_device_lose_nothing::/) |
    test(/^remove_local_killed_at_any_step_then_included_deletes_nothing::/) |
    test(=status_says_when_changes_wait_and_why) |
    test(=the_daemon_compacts_a_state_its_join_left_mostly_free) |
    test(=the_pause_after_a_sync_counts_its_merge_up_to_30_s) |
    test(=the_periodic_check_holds_little_more_than_the_round) |
    test(=what_rules_leave_out_goes_the_incremental_way)
)"""
