name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get install -y musl-tools
      # Ubuntu's AppArmor forbids the unprivileged namespaces that the real full-disk test needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bash scripts/ci.sh
        env:
          CAIRN_SEEDS: "200"
      - run: rustup target add x86_64-unknown-linux-musl
      # Only that a release builds, static and without build paths: its binary is thrown away, so it
      # needs no feed to update from.
      - run: bash scripts/release.sh
        env:
          CAIRN_UPDATE: "off"
