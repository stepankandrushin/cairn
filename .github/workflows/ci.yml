name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The tests run under cargo-nextest (scripts/ci.sh).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Ubuntu's AppArmor forbids the unprivileged namespaces that the real full-disk test needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # A test that cannot run here fails instead of skipping: libtest hides a skip's line, so a change
      # of image would otherwise leave tests that never ran showing as passed.
      - run: bash scripts/ci.sh
        env:
          CAIRN_SEEDS: "200"
          CAIRN_NO_SKIP: "1"
      - run: rustup target add x86_64-unknown-linux-musl
      # musl-gcc, for the C the release build links statically. Not by apt alone: GitHub's runners once
      # resolved none of Ubuntu's hosts for hours, which held every run before its first test.
      - run: bash .github/install-musl-tools.sh
      # Only that a release builds, static and without build paths: its binary is thrown away, so it
      # needs no feed to update from.
      - run: bash scripts/release.sh
        env:
          CAIRN_UPDATE: "off"
