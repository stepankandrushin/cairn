[package]
name = "cairn-engine"
description = "Cairn sync engine: symlink-safe filesystem access, lossless metadata capture, three-way merge, crash-safe apply."
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cairn-protocol.workspace = true
cairn-failpoint.workspace = true
anyhow.workspace = true
base64.workspace = true
blake3.workspace = true
fastcdc.workspace = true
hex.workspace = true
ignore.workspace = true
rand.workspace = true
ring = "0.17"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[features]
failpoints = ["cairn-failpoint/enabled"]
