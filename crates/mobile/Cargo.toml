[package]
name = "cairn-mobile"
description = "The core of Cairn's phone apps, for Swift and Kotlin through uniffi: the server's folders as they are opened, files downloaded only when asked for, and photo uploads that a kill or a lost answer neither loses nor doubles."
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "cairn_mobile"
# staticlib for iOS, cdylib for Android.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"

[dependencies]
cairn-protocol.workspace = true
cairn-engine.workspace = true
cairn-failpoint.workspace = true
anyhow.workspace = true
base64.workspace = true
blake3.workspace = true
hex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uniffi = { version = "0.32", features = ["cli"] }

# Android's certificate verifier calls into the JVM, given it once at the app's start (android.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"

[features]
failpoints = ["cairn-engine/failpoints", "cairn-failpoint/enabled"]
