[package]
name = "cairn-server"
description = "The Cairn server: one binary holding chunks, revisions and the journal."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "cairn-server"
path = "src/main.rs"

[dependencies]
cairn-protocol.workspace = true
cairn-store.workspace = true
cairn-failpoint.workspace = true
anyhow.workspace = true
argon2 = "0.5"
axum.workspace = true
base64.workspace = true
blake3.workspace = true
clap.workspace = true
fastcdc.workspace = true
futures-util = { version = "0.3", default-features = false }
hex.workspace = true
# The accept loop of its own src/conn.rs so that a handler may send an informational answer, a 104 to a
# resumable upload, which hyper cannot.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2 = "0.6"
tokio = { workspace = true, features = ["fs", "io-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["termios"] }

[features]
failpoints = ["cairn-store/failpoints", "cairn-failpoint/enabled"]
