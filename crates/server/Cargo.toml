[package]
name = "cairn-server"
description = "The Cairn server: one binary holding chunks, revisions and the journal."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "cairn-server"
path = "src/main.rs"

[dependencies]
cairn-protocol.workspace = true
cairn-store.workspace = true
cairn-failpoint.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
blake3.workspace = true
clap.workspace = true
fastcdc.workspace = true
futures-util = { version = "0.3", default-features = false }
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[features]
failpoints = ["cairn-store/failpoints", "cairn-failpoint/enabled"]
