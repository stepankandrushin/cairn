[package]
name = "cairn-tray"
description = "A tray for Cairn's daemons: what each is doing, and what a person deals with."
license = "Apache-2.0"
version = "0.1.18"
edition = "2021"
rust-version = "1.89"
publish = false

# Its own workspace: it needs a desktop's webview to build, which CI and the root workspace do not have.
[workspace]

[features]
default = ["gui"]
# Without it, only `--probe` and `--login`: what can be built and checked where no webview is.
gui = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:block2",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
]

[dependencies]
cairn-protocol = { path = "../crates/protocol" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", optional = true, features = ["tray-icon"] }
trash = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# For the menu: whether it is open, and how an item was clicked (src/native.rs). Tauri's own versions.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSApplication",
    "NSEvent",
    "NSMenu",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "block2",
    "NSNotification",
    "NSOperation",
    "NSString",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
